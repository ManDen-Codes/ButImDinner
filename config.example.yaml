# Copy this file to config.yaml and fill in your values

# Discord bot token (from https://discord.com/developers/applications)
bot_token: "YOUR_BOT_TOKEN_HERE"

# The Discord server (guild) ID to scrape
guild_id: 000000000000000000

# Dinner's Discord user ID
dinner_user_id: 000000000000000000

# Scraper settings
scraper:
  # Number of context messages before each Dinner message
  context_window: 10

# Recency weighting: recent messages are duplicated more times in the training set.
# Each bucket applies to messages older than the previous but within `months` months.
# The last bucket catches everything older.
recency_weights:
  - months: 6
    weight: 4
  - months: 12
    weight: 3
  - months: 24
    weight: 2
  - months: 9999
    weight: 1

# Training settings
training:
  base_model: "Qwen/Qwen3-8B"
  epochs: 3
  batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 0.0001
  max_seq_length: 768
  lora_rank: 64
  lora_alpha: 128
  # Oversample GIF training pairs (low count in dataset)
  gif_oversample: 4
  # Target ratio of "none" actions in dataset (0.35 = 35%)
  none_ratio: 0.35
  
# Bot settings
bot:
  # Chance of engaging with any message — model decides what action to take (0.05 = 5%)
  engagement_chance: 0.05
  # Channel IDs the bot is allowed to engage in
  allowed_channels:
    - 000000000000000000
  # Path to the GGUF model file
  model_path: "data/model/dinner.gguf"
  # Number of recent messages to use as context when generating a reply
  context_messages: 10
  # Maximum tokens in a generated reply
  max_response_tokens: 256
  # Always reply when @mentioned (true/false)
  reply_on_mention: false
  # Decay rate for reply chains — probability of replying = decay^(bot_replies_in_chain)
  # 0.5 = 50% after 1st reply, 25% after 2nd, 12.5% after 3rd, etc.
  reply_chain_decay: 0.65
  # Name to replace bot's @mention with in model input
  mention_name: "dinner"
  # Generation parameters
  temperature: 0.8
  top_p: 0.9
