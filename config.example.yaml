# Copy this file to config.yaml and fill in your values

# Discord bot token (from https://discord.com/developers/applications)
bot_token: "YOUR_BOT_TOKEN_HERE"

# The Discord server (guild) ID to scrape
guild_id: 000000000000000000

# Dinner's Discord user ID
dinner_user_id: 000000000000000000

# Scraper settings
scraper:
  # Number of context messages before each Dinner message
  context_window: 10

# Recency weighting: recent messages are duplicated more times in the training set.
# Each bucket applies to messages older than the previous but within `months` months.
# The last bucket catches everything older.
recency_weights:
  - months: 6
    weight: 4
  - months: 12
    weight: 3
  - months: 24
    weight: 2
  - months: 9999
    weight: 1

# Training settings
training:
  base_model: "unsloth/Qwen3-4B"
  epochs: 5
  batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  max_seq_length: 512
  lora_rank: 64
  lora_alpha: 128
  
# Bot settings
bot:
  # Chance of replying to any message (0.0001 = 0.01%)
  reply_chance: 0.0001
  # Channel IDs the bot is allowed to reply in
  allowed_channels:
    - 000000000000000000
  # Path to the GGUF model file
  model_path: "data/model/dinner.gguf"
  # Number of recent messages to use as context when generating a reply
  context_messages: 10
  # Maximum tokens in a generated reply
  max_response_tokens: 256
  # Always reply when @mentioned (true/false)
  reply_on_mention: false
  # Name to replace bot's @mention with in model input
  mention_name: "dinner"
  # Generation parameters
  temperature: 0.8
  top_p: 0.9
